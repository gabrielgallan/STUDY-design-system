name: Deploy Docs

on:
    push:
        branches:
            - master

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "20.x"

            - run: npm ci

            - name: Build Storybook
              run: npm run build

            - name: Deploy Storybook
              run: npm run deploy --workspace @gallan-ignite-ui/docs -- --ci --existing-output-dir=storybook-static
              env:
                  GH_TOKEN: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
